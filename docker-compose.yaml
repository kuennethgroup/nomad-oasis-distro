x-ubt-access-environment: &ubt-access-environment
  NOMAD_UBT_ALLOWED_EMAIL_DOMAINS: "uni-bayreuth.de"
  NOMAD_UBT_ALLOWED_EMAILS_FILE: "/etc/nomad-ubt-access/allowed-emails.json"

services:

  # watchtower container, will pull new images from github automatically at 3 AM
  watchtower:
    image: nickfedor/watchtower
    container_name: nomad_oasis_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Instruct Watchtower to ONLY update containers with the explicit label
      # label "com.centurylinklabs.watchtower.enable=true"
      - WATCHTOWER_LABEL_ENABLE=true
      # Automatically remove old images after updating
      - WATCHTOWER_CLEANUP=true
      - TZ=Europe/Berlin # Change to your preferred timezone
      - WATCHTOWER_SCHEDULE=0 0 3 * * * #3 AM


  # the search engine
  elastic:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: nomad_oasis_elastic
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elastic:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://elastic:9200/_cat/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # the user data db
  mongo:
    restart: unless-stopped
    image: docker.io/mongo:8.0
    container_name: nomad_oasis_mongo
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - mongo:/data/db
      - mongo_config:/data/configdb
      - ./.volumes/mongo:/backup
    command: mongod --logpath=/dev/null # --quiet
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "mongo:27017/test"
        - "--quiet"
        - "--eval"
        - "'db.runCommand({ping:1}).ok'"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  postgresql:
    restart: unless-stopped
    container_name: nomad_oasis_postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: docker.io/postgres:16
    volumes:
      - postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-setup-db:
    image: temporalio/admin-tools:1.31
    container_name: temporal-setup-db
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - SQL_PASSWORD=temporal
    volumes:
      - ./scripts/_setup_temporal.sh:/scripts/_setup_temporal.sh
    entrypoint: ["/bin/sh", "/scripts/_setup_temporal.sh"]
    command: ["setup_db"]

  temporal-create-namespace:
    image: temporalio/admin-tools:1.31
    container_name: temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    volumes:
      - ./scripts/_setup_temporal.sh:/scripts/_setup_temporal.sh
    entrypoint: ["/bin/sh", "/scripts/_setup_temporal.sh"]
    command: ["create_namespace"]

  temporal:
    restart: unless-stopped
    image: temporalio/server:1.31
    container_name: nomad_oasis_temporal
    depends_on:
      postgresql:
        condition: service_healthy
      temporal-setup-db:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./configs/_temporal-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # nomad worker (processing)
  worker:
    restart: unless-stopped
    image: ${NOMAD_IMAGE:-ghcr.io/kuennethgroup/nomad-oasis-distro:2.0.0-ubt.1}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    platform: linux/amd64
    environment:
      NOMAD_SERVICE: nomad_oasis_worker
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_ELASTIC_VERSION: 9
      NOMAD_TEMPORAL_HOST: temporal
      ACADEMIC_CLOUD_API_KEY: ${ACADEMIC_CLOUD_API_KEY}
    env_file:
      - ./.env
    depends_on:
      temporal:
        condition: service_healthy
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      # - ./configs/nomad.yaml:/app/nomad.yaml
      - ./.volumes/fs:/app/.volumes/fs
    command: python -m nomad_ubt_access admin run action-internal-worker
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8080/health"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "4.0" # Maximum 4 CPU cores
          memory: 8G # Maximum 8GB RAM

  # nomad gpu worker (actions)
