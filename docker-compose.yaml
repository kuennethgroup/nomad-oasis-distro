  # nomad app (api + proxy)
  app:
    restart: unless-stopped
    image: ${NOMAD_IMAGE:-ghcr.io/kuennethgroup/nomad-oasis-distro:2.0.0-ubt.1}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    platform: linux/amd64
    container_name: nomad_oasis_app
    environment:
      <<: *ubt-access-environment
      NOMAD_SERVICE: nomad_oasis_app
      NOMAD_SERVICES_API_PORT: 443
      NOMAD_FS_EXTERNAL_WORKING_DIRECTORY: "$PWD"
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_ELASTIC_VERSION: 9
      NOMAD_NORTH_HUB_HOST: north
      NOMAD_TEMPORAL_HOST: temporal
      NOMAD_UBT_REQUIRE_VERIFIED_EMAIL: "true"
      NOMAD_UBT_RESTRICTION_URL: "/access-restricted"
      ACADEMIC_CLOUD_API_KEY: ${ACADEMIC_CLOUD_API_KEY}
    env_file:
      - ./.env
    depends_on:
      temporal:
        condition: service_healthy
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      # - ./configs/nomad.yaml:/app/nomad.yaml
      - ./.volumes/fs:/app/.volumes/fs
      - ./configs/access:/etc/nomad-ubt-access:ro
    command: python -m nomad_ubt_access admin run app --with-gui --gunicorn --host 0.0.0.0 --workers 2
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8000/-/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # nomad remote tools hub (JupyterHUB)
  north:
    restart: unless-stopped
    image: ghcr.io/fairmat-nfdi/nomad-north:main
    platform: linux/amd64
    container_name: nomad_oasis_north
    environment:
      <<: *ubt-access-environment
      NOMAD_API_URL: "http://app:8000/backend/api/v1"
      BASE_URL: "/backend/north/"
      OAUTH_CALLBACK_URL: "https://data.ing.uni-bayreuth.de/backend/north/hub/oauth_callback"
      DOCKER_PREFIX: "nomad-oasis-north"
      DOCKER_NETWORK: "nomad_oasis_network"
    env_file:
      - ./.env.north
    volumes:
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - "nomad_north:/data"
      # Extend the image's standard config with the same UBT policy as NOMAD.
      - "./configs/jupyterhub_ubt_config.py:/etc/jupyterhub/jupyterhub_ubt_config.py:ro"
      - "./configs/access:/etc/nomad-ubt-access:ro"
    command: ["jupyterhub", "-f", "/etc/jupyterhub/jupyterhub_ubt_config.py"]
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:9000/backend/north/hub/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  # nomad proxy (a reverse proxy for nomad)
  proxy:
    restart: unless-stopped
    image: docker.io/nginx:1.31.1-alpine
    container_name: nomad_oasis_proxy
    command: nginx -g 'daemon off;'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nomad-oasis.rule=Host(`data.ing.uni-bayreuth.de`)"
      - "traefik.http.routers.nomad-oasis.entrypoints=https"
      - "traefik.http.routers.nomad-oasis.tls=true"
      - "traefik.http.routers.nomad-oasis.middlewares=nomad-oasis-secure-headers"
      - "traefik.http.middlewares.nomad-oasis-secure-headers.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.nomad-oasis-secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nomad-oasis-secure-headers.headers.stsPreload=true"
      - "traefik.http.services.nomad-oasis.loadbalancer.server.port=80"
      - "traefik.docker.network=public-network"
    volumes:
      # Shared config
      - ./configs/nginx_base_conf:/etc/nginx/conf.d/nginx_base_conf:ro
      - ./configs/nginx_maps_conf:/etc/nginx/conf.d/nginx_maps_conf:ro
      # Traefik terminates TLS and forwards HTTP on the Docker network.
      - ./configs/nginx_http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./configs/access/access-policy.js:/usr/share/nginx/html/access-policy.js:ro
      - ./configs/access/access-restricted.html:/usr/share/nginx/html/access-restricted.html:ro
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_started # TODO: service_healthy
      north:
        condition: service_healthy
    networks:
      - default
      - public-network

  # jupyterlab image: (this is only used to pull the image, no service is run for this)
  jupyterlab_image:
    image: ghcr.io/kuennethgroup/nomad-oasis-distro/jupyter:main
    platform: linux/amd64
    container_name: nomad_jupyter_image
    pull_policy: always
    entrypoint: ["true"]
    deploy:
      replicas: 0 # Ensures the service isn't started

volumes:
  mongo:
    name: "nomad_oasis_mongo"
  mongo_config:
    name: "nomad_oasis_mongo_config"
  elastic:
    name: "nomad_oasis_elastic_9"
  postgresql:
    name: "nomad_oasis_postgresql"
  nomad_north:
    name: "nomad_oasis_north"


networks:
  default:
    name: nomad_oasis_network
  public-network:
    external: true
