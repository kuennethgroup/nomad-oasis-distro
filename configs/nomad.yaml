services:
  api_host: "localhost"
  api_base_path: "/nomad-oasis"

oasis:
  is_oasis: true
  uses_central_user_management: true

plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image: ghcr.io/kuennethgroup/nomad-oasis-distro/jupyter:main
      nomad_auto_upload_tables.parsers:tabular_guess_parser:
        api_key: '${ACADEMIC_CLOUD_API_KEY}'
        model: openai-gpt-oss-120b
        base_url: https://chat-ai.academiccloud.de/v1          

meta:
  deployment: "oasis"
  deployment_url: "https://my-oasis.org/api"
  maintainer_email: "me@my-oasis.org"

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

north:
  enabled: true
  enable_new_hub_api: true
