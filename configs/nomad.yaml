services:
  api_host: "data.ing.uni-bayreuth.de"
  api_base_path: ""
  api_port: 443
  https: true
  https_upload: true

ui:
  app_base: "https://data.ing.uni-bayreuth.de"
  north_base: "https://data.ing.uni-bayreuth.de/north"

oasis:
  is_oasis: true
  uses_central_user_management: true

plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image: ghcr.io/kuennethgroup/nomad-oasis-distro/jupyter:main
      nomad_auto_upload_tables.parsers:tabular_guess_parser:
        api_key: '${ACADEMIC_CLOUD_API_KEY}'
        model: qwen3.5-122b-a10b
        base_url: https://chat-ai.academiccloud.de/v1          

meta:
  deployment: "oasis"
  deployment_url: "https://data.ing.uni-bayreuth.de/api"
  maintainer_email: "rayan967@gmail.com"

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

north:
  enabled: true
  enable_new_hub_api: true
