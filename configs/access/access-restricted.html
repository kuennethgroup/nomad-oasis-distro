<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Access restricted | NOMAD Oasis</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f4f6f8;
        color: #17202a;
      }
      main {
        width: min(36rem, calc(100% - 3rem));
        padding: 2.5rem;
        border-radius: 0.75rem;
        background: white;
        box-shadow: 0 0.75rem 2.5rem rgb(0 0 0 / 12%);
      }
      h1 {
        margin-top: 0;
        color: #263f6a;
      }
      p {
        line-height: 1.6;
      }
      a {
        color: #235aa6;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111820;
          color: #edf2f7;
        }
        main {
          background: #1c2733;
        }
        h1, a {
          color: #8ab4f8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Access restricted</h1>
      <p>
        This NOMAD Oasis is available only to accounts with a verified
        <strong>@uni-bayreuth.de</strong> email address.
      </p>
      <p>
        If your University of Bayreuth address is not attached to your NOMAD
        account, update and verify it in NOMAD's central account management,
        then sign in again.
      </p>
      <p><a href="/nomad-oasis/gui/">Return to NOMAD</a></p>
    </main>
  </body>
</html>
